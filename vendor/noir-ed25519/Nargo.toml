[package]
name = "ed25519"
type = "lib"
authors = [""]
compiler_version = ">=1.0.0"

[dependencies]
bignum = { git = "https://github.com/noir-lang/noir-bignum", tag = "v0.10.0" }
# alpha.4 binds the reconstructed scalar slices to the scalar
# (`hi * 2^128 + lo == x`); alpha.2 does not. Do not downgrade.
edwards_bignum = { git = "https://github.com/willemolding/noir-edwards-bignum", tag = "v0.1.0-alpha.4" }
sha512 = { tag = "v0.2.0", git = "https://github.com/zkpassport/sha512" }
